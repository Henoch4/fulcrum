<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Fulcrum — Perpetual Futures on BOT Chain</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin="">
<link href="https://fonts.googleapis.com/css2?family=Unbounded:wght@400;700&family=JetBrains+Mono:wght@400;600&display=swap" rel="stylesheet">





<style>
:root{--motion-fast:200ms;--motion-base:600ms;--motion-slow:1100ms;--wine:#0d0a1a;--wine2:#1c1436;--bone:#ece6ff;--long:#e4ff1a;--short:#8f4dff;--split:50%}
*{box-sizing:border-box;margin:0;padding:0}
html{scroll-behavior:smooth}
body{background:var(--wine);color:var(--bone);font:400 14px/1.55 'JetBrains Mono',monospace;overflow-x:hidden}
.mono{font-family:'JetBrains Mono',monospace}
a{color:inherit}
.top{position:fixed;inset:0 0 auto 0;z-index:40;display:flex;gap:8px;flex-wrap:wrap;align-items:center;padding:10px 16px;background:linear-gradient(var(--wine),#0d0a1a00)}
.top .lg{font:400 24px Unbounded;letter-spacing:.04em;margin-right:auto;text-transform:uppercase}
.top select,.top button,#badge,.xl{background:none;border:1px solid var(--bone);color:var(--bone);padding:6px 10px;font:600 12px 'JetBrains Mono';border-radius:0;text-decoration:none;display:inline-flex;gap:6px;align-items:center;cursor:pointer}
.top select option{color:#000}
#badge{background:var(--long);color:#000;border-color:var(--long)}
#connect{background:var(--short);border-color:var(--short);color:#fff}
.hero{position:relative;height:100vh;min-height:620px;overflow:hidden}
.side{position:absolute;inset:0;display:flex;align-items:center;transition:clip-path .25s}
.side.l{background:var(--long);color:#161a00;clip-path:polygon(0 0,calc(var(--split) + 8%) 0,calc(var(--split) - 8%) 100%,0 100%)}
.side.s{background:var(--short);color:#fff;clip-path:polygon(calc(var(--split) + 8%) 0,100% 0,100% 100%,calc(var(--split) - 8%) 100%)}
.side h1{font:400 clamp(110px,26vw,420px)/.8 Unbounded;text-transform:uppercase;position:absolute;letter-spacing:-.01em}
.side.l h1{left:2vw;bottom:9vh}.side.s h1{right:2vw;top:12vh}
.side small{position:absolute;font:600 12px 'JetBrains Mono';max-width:240px}
.side.l small{left:3vw;top:16vh}.side.s small{right:3vw;bottom:14vh;text-align:right}
.launch{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%) rotate(-6deg);background:var(--bone);color:var(--wine);padding:10px 18px;font:400 clamp(18px,3vw,34px) Unbounded;text-transform:uppercase;white-space:nowrap;z-index:5;box-shadow:8px 8px 0 var(--wine)}
.tick{background:var(--bone);color:var(--wine);overflow:hidden;white-space:nowrap;font:600 13px 'JetBrains Mono';padding:8px 0;border-block:2px solid var(--wine)}
.tick div{display:inline-block;animation:mq 30s linear infinite}
.tick span{margin:0 22px}.up{color:#5f7300}.dn{color:#5a1fc2}
@keyframes mq{to{transform:translateX(-50%)}}
section{padding:90px 5vw}
h2{font:400 clamp(44px,8vw,120px)/.9 Unbounded;text-transform:uppercase;margin-bottom:28px}
h2 em{font-style:normal;color:var(--long)}h2 i{font-style:normal;color:var(--short)}
.grid{display:grid;grid-auto-flow:dense;grid-template-columns:1.5fr 1fr;gap:40px;align-items:start}
.grid>div:nth-child(2){margin-top:70px}
.chart{border:1px solid #ece6ff55;background:var(--wine2);position:relative}
canvas{width:100%;height:340px;display:block}
.px{position:absolute;left:14px;top:10px;font:400 54px Unbounded}
.px small{font:600 12px 'JetBrains Mono';opacity:.7;margin-left:8px}
.panel{background:var(--bone);color:var(--wine);padding:22px;position:relative}
.panel h3{font:400 28px Unbounded;text-transform:uppercase;margin-bottom:14px}
.lvr{display:grid;grid-template-columns:1fr 1fr;margin-bottom:16px}
.lvr button{font:400 30px Unbounded;text-transform:uppercase;padding:16px;border:2px solid var(--wine);background:none;color:var(--wine);cursor:pointer;transition:.2s}
.lvr button.on.L{background:var(--long)}.lvr button.on.S{background:var(--short);color:#fff}
label{display:block;font-size:11px;text-transform:uppercase;letter-spacing:.12em;margin:12px 0 4px}
input[type=number],input[type=text]{width:100%;background:none;border:0;border-bottom:2px solid var(--wine);padding:8px 0;font:600 20px 'JetBrains Mono';color:inherit;outline:0}
input[type=range]{width:100%;accent-color:var(--short)}
.row{display:flex;justify-content:space-between;font-size:12px;margin-top:8px}
.go{width:100%;margin-top:18px;padding:16px;font:400 26px Unbounded;text-transform:uppercase;border:0;background:var(--wine);color:var(--bone);cursor:pointer}
.go:hover{background:var(--short)}
.ghost{background:none;border:1px solid currentColor;color:inherit;padding:6px 10px;font:600 12px 'JetBrains Mono';cursor:pointer}
.pos{display:grid;grid-template-columns:70px 1fr 1fr 1fr auto;gap:10px;align-items:center;padding:14px 0;border-bottom:1px solid #ece6ff33}
.pos b{font:400 22px Unbounded}.pos .L{color:var(--long)}.pos .S{color:var(--short)}
.pos .pnl{font:400 22px Unbounded}
.adm{display:grid;grid-template-columns:1fr 1fr;gap:40px;margin-top:50px}
.adm .box{border:1px solid #ece6ff55;padding:20px}
.adm input{color:var(--bone);border-color:var(--bone)}
.adm .go{background:var(--bone);color:var(--wine);font-size:20px}
.adm .go:hover{background:var(--long)}
.rv{opacity:0;transform:translateY(40px);transition:1s cubic-bezier(.2,.8,.2,1)}.rv.in{opacity:1;transform:none}
#cur{position:fixed;z-index:60;pointer-events:none;left:0;top:0;mix-blend-mode:difference}
#cur i{position:absolute;background:#fff}
#cur .h{width:100vw;height:1px;left:-100vw;margin-left:50vw}#cur .v{height:100vh;width:1px;top:-100vh;margin-top:50vh}
.xx{padding:60px 5vw;text-align:center;font:400 clamp(26px,5vw,60px)/1 Unbounded;text-transform:uppercase}
footer{display:flex;flex-wrap:wrap;gap:6px 14px;padding:22px 5vw;border-top:1px solid #ece6ff55;font-size:12px}
footer .mono{font-family:'JetBrains Mono',monospace}
#toasts{position:fixed;right:14px;bottom:14px;z-index:90;display:flex;flex-direction:column;gap:8px}
.toast{background:var(--bone);color:var(--wine);padding:10px 14px;font:600 12px 'JetBrains Mono';border-left:8px solid var(--wine);transform:translateX(130%);transition:.4s;max-width:80vw}
.toast.on{transform:none}.toast.ok{border-color:var(--long)}.toast.err{border-color:var(--short)}.toast.demo{border-color:#ff9f1c}
@media(max-width:800px){.grid,.adm{grid-template-columns:1fr}.grid>div:nth-child(2){margin-top:0}.pos{grid-template-columns:50px 1fr 1fr}.side small{display:none}.top .lg{font-size:20px}#cur{display:none}}
@media(pointer:coarse){#cur{display:none}}

@media(prefers-reduced-motion:reduce){.rv{transition:none!important;opacity:1;transform:none!important}*{animation:none!important}}
button:focus-visible,a:focus-visible,input:focus-visible,select:focus-visible{outline:2px solid var(--acc,currentColor);outline-offset:2px}</style><link href="./product.css" rel="stylesheet"><script defer src="./vendor/ethers.umd.min.js"></script><script defer src="./product.js"></script></head><body id="top" class="suite-product su-dock"><div class="suite-nav" role="navigation" aria-label="Main navigation"><a class="suite-brand" href="#top">Fulcrum</a><span id="suite-network" role="status">Checking mainnet…</span><button id="suite-wallet" type="button" disabled>Connect wallet</button><button id="suite-disconnect" type="button" hidden>Disconnect</button><a href="#suite-workspace">Open app</a></div>

<section id="suite-actions" aria-labelledby="suite-actions-heading"><h2 id="suite-actions-heading">Your next move</h2><p id="suite-actions-note"></p><div class="suite-grid" id="suite-action-grid"></div></section>
<section id="suite-lookup" aria-labelledby="suite-lookup-heading"><h2 id="suite-lookup-heading">Find a record</h2><label class="suite-field" for="suite-query">What would you like to look up?<select id="suite-query"></select></label><form id="suite-query-form"></form><div id="suite-query-result" class="suite-result" aria-live="polite"></div><div id="suite-record-actions" class="suite-grid"></div></section>
